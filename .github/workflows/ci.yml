name: Verify planner
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      # Synthetic public configuration; all account API requests are mocked.
      PUBLIC_SUPABASE_URL: 'https://aemfewsfcrcmtafnypxa.supabase.co'
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_fixture_only'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs
      - run: pnpm test:workflow
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:connected
      - run: pnpm check:offline
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/check-reproducible.mjs
      - run: pnpm check:privacy
      - uses: actions/upload-artifact@v4
        with:
          name: party-map
          path: dist/party-map.html
